name: Build Android APK

concurrency:
  group: fcplus-android-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, codex/fcplus-trader-v040 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android 35 SDK
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify trading state machine
        run: |
          node --check app/src/main/assets/fcplus_ext/content.js
          node --test tests/*.test.cjs

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FCPlus-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
